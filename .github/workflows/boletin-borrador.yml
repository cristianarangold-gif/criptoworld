# Cuando se publica un resumen semanal en main, crea el borrador del boletín en Brevo.
# Solo crea borradores: el envío lo hace siempre el propietario desde Brevo.
name: Borrador del boletín

on:
  push:
    branches: [main]
    paths: ['content/resumenes/**']
  # Para repetir un borrador que falló: Actions → «Borrador del boletín» → Run workflow.
  workflow_dispatch:
    inputs:
      resumen:
        description: 'Resumen a convertir en borrador (p. ej. content/resumenes/2026-semana-42.md)'
        required: true

permissions:
  contents: read

jobs:
  borrador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resúmenes nuevos
        id: nuevos
        env:
          RESUMEN: ${{ inputs.resumen }}
        run: |
          if [ -n "$RESUMEN" ]; then
            if [[ "$RESUMEN" =~ ^content/resumenes/[0-9a-z-]+\.md$ ]]; then files="$RESUMEN"; else echo "::error::Ruta no válida: $RESUMEN"; exit 1; fi
          else
            files=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/resumenes/*.md' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Resúmenes nuevos: ${files:-ninguno}"
      - uses: actions/setup-node@v4
        if: steps.nuevos.outputs.files != ''
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: steps.nuevos.outputs.files != ''
        run: npm ci
      - name: Crear borrador en Brevo
        if: steps.nuevos.outputs.files != ''
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: npx tsx scripts/boletin-borrador.ts ${{ steps.nuevos.outputs.files }}
